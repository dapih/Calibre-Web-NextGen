name: Windows package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Windows release tag (cwng-windows-vX.Y.Z-rN). Leave blank to test without creating a draft.'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows package and smoke test
    if: github.repository == 'dapih/Calibre-Web-NextGen'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whether the PR only changes documentation
        if: github.event_name == 'pull_request'
        id: scope
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Compare the tested merge commit with its base. A rename counts as both paths.
          $paths = git diff --name-only --no-renames $env:BASE_SHA HEAD --
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Could not classify the PR changes. Running the Windows smoke test.'
            exit 0
          }
          $documentation = '^(AGENTS|AI_README|CHANGELOG|CHANGES-vs-upstream|CONTRIBUTING|README)\.md$|^(docs|changelog\.d|changelogs)/.+\.md$'
          $packageChanges = $paths | Where-Object {
            $_ -cnotmatch $documentation -or $_ -ceq 'docs/install/windows-package.md'
          }
          if ($paths -and -not $packageChanges) {
            'docs_only=true' >> $env:GITHUB_OUTPUT
            'Documentation-only PR. No Windows package inputs changed.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Validate the release request
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'Dispatch this workflow on main.' }
          if ($env:RELEASE_TAG) {
            $version = [regex]::Escape((Get-Content -Raw VERSION).Trim())
            if ($env:RELEASE_TAG -cnotmatch "^cwng-windows-v$version-r[1-9][0-9]*$") {
              throw 'Use cwng-windows-vX.Y.Z-rN with the version from VERSION.'
            }
          }

      - name: Build the Windows package
        if: steps.scope.outputs.docs_only != 'true'
        shell: powershell
        run: .\scripts\windows-build-launcher.ps1

      - name: Download and verify the previous Windows package
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $filter = @'
          .[] | select(.draft == false and .prerelease == false) | . as $release
          | (if (.tag_name | startswith("cwng-windows-v")) then (.tag_name + ".zip")
             elif (.tag_name | startswith("windows-v")) then "cwng-windows.zip"
             else null end) as $package
          | .assets[] | select(.name == $package and .state == "uploaded")
          | {tag_name: $release.tag_name, published_at: $release.published_at, asset: .}
          '@
          $rows = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq $filter
          if ($LASTEXITCODE) { throw 'Could not list published Windows releases.' }
          $previous = $rows | ConvertFrom-Json | Sort-Object published_at -Descending | Select-Object -First 1
          if (-not $previous) { throw 'No published split Windows package is available to test an upgrade.' }
          if ($env:RELEASE_TAG) {
            $requested = [version]($env:RELEASE_TAG -creplace '^cwng-windows-v' -creplace '-r', '.')
            $published = [version]($previous.tag_name -creplace '^(cwng-)?windows-v' -creplace '-r', '.')
            if ($requested -le $published) { throw 'Use a tag newer than the published Windows release.' }
          }
          gh release download $previous.tag_name --repo $env:GITHUB_REPOSITORY --pattern $previous.asset.name --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'Could not download the published Windows package.' }
          $file = Get-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $previous.asset.name)
          $digest = 'sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($file.Length -ne $previous.asset.size -or $digest -cne $previous.asset.digest) {
            throw 'The previous Windows package failed size or SHA-256 verification.'
          }
          "CWNG_PREVIOUS_PACKAGE=$($file.FullName)" >> $env:GITHUB_ENV
          "Upgrade baseline: $($previous.tag_name)" >> $env:GITHUB_STEP_SUMMARY

      - name: Install, start, and import a book
        if: steps.scope.outputs.docs_only != 'true'
        shell: powershell
        run: .\tests\windows\release-smoke.ps1 -PreviousPackage $env:CWNG_PREVIOUS_PACKAGE

      - name: Store the tested release assets
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-assets
          path: |
            dist/windows/cwng-installer.exe
            dist/windows/cwng-windows.zip
          if-no-files-found: error

  draft:
    name: Create draft Windows release
    needs: windows
    if: github.repository == 'dapih/Calibre-Web-NextGen' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-assets
          path: windows-release-assets

      - name: Attach the tested assets to a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          installer="windows-release-assets/${RELEASE_TAG}-installer.exe"
          package="windows-release-assets/${RELEASE_TAG}.zip"
          mv -- windows-release-assets/cwng-installer.exe "$installer"
          mv -- windows-release-assets/cwng-windows.zip "$package"
          test -s "$installer"
          test -s "$package"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Review it in GitHub."
            exit 1
          fi
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null; then
            # A rerun may find the tag created by a previous attempt.
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
            test "$existing" = "$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" "$installer" "$package" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "CWNG for Windows ${RELEASE_TAG#cwng-windows-}" --notes "Windows x64 build of fork commit $GITHUB_SHA."
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)
          jq -e '.isDraft and (.assets | length == 2)' <<<"$assets" >/dev/null
          for file in "$installer" "$package"; do
            digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            jq -e --arg name "${file##*/}" --arg digest "$digest" \
              'any(.assets[]; .name == $name and .state == "uploaded" and .digest == $digest)' <<<"$assets" >/dev/null
          done
